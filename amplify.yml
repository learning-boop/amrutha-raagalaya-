version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Next.js 16 needs Node 20.9 or newer.
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        # Amplify doesn't hand console environment variables to the server at
        # runtime, so write the ones the app reads into .env.production.
        - env | grep -E '^(DATABASE_URL|DIRECT_URL|SESSION_SECRET|CLOUDINARY_CLOUD_NAME|CLOUDINARY_API_KEY|CLOUDINARY_API_SECRET)=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
